<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Post Card</title>
        <link rel="stylesheet" href="/CatPhotoApp/css/blogpost_card.css">
    </head>
    <body>
        <div class = "blog-post-card">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt = "Cover Photo" class = "post-img">
            <div class="post-content">
                <h2 class="post-title">Blog Post Title</h2>
                <p class= "post-excerpt">This is a short excerpt from the blog post.</p>
                <a href="read-more" class="read-more">Read More</a>
            </div>
        </div>
        
    </body>
</html>
