<!DOCTYPE html>
<html lang="en">
<head>

</head>

      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Learn HTML Resources</a></li>
      </ul>
      </li>
      <li>
      <input type="checkbox" name="todo2" id="todo2">

      </li>
      <li>

      <!-- Sub-items for Learn JavaScript -->
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Learn JavaScript Resources</a></li>
      </ul>
      </li>
      <li>
      <input type="checkbox" name="todo4" id="todo4">

      <!-- Sub-items for Learn PHP -->
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Learn PHP Resources</a></li>
      </ul>
      </li>
      <li>
      <input type="checkbox" name="todo5" id="todo5">
      <label for="todo5">Build a project</label>
      <!-- Sub-items for Build a project -->
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Project Ideas</a></li>
      </ul>
      </li>
    </ul>
    </main>
</body>
</html>
