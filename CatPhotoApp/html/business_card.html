<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Business Card</title>
        <link rel="stylesheet" href="../css/business_card.css">
    </head>
    <body>
        <main>
            <div class="business-card">
                <img class="profile-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5lThUXgBowwa-nAq2BmQy23hktuwUv9UaY4VW9ueq2A&s=10" alt="Profile Image">
                <p class="full-name">Jane Doe</p>
                <p class="designation">Cosmetologist</p>
                <p class="company">Beauty Co.</p>
                <hr>
                <p class="contact-info">Email: jane.doe@example.com</p>
                <p class="contact-info">Phone: (123) 456-7890</p>
                <a href ="https://janedoeportfolio.com">Portfolio</a>
                <hr>
              <div class="social-media">
                <h2>Connect with me</h2>
                <p class="social-media-info">Follow me on social media platforms to stay updated with my latest work and projects.</p>
                <ul class="social-media-links">
                    <li><a href="https://www.facebook.com/janedoe">Facebook</a></li>
                    <li><a href="https://www.twitter.com/janedoe">Twitter</a></li>
                    <li><a href="https://www.linkedin.com/in/janedoe">LinkedIn</a></li>
                    <li><a href="https://www.instagram.com/janedoe">Instagram</a></li>
                    <li><a href="https://www.github.com/janedoe">Github</a></li>
                </ul>
              </div>
            </div>
        </main>
    </body>
</html>
