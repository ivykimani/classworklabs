<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Multimedia Player</title>
    </head>
    <body>
        <h1>Multimedia Player</h1>
        <section>
        <h2>Now Playing: Stoked-Theme Song</h2>
        <audio controls loop aria-label="Stoked-Theme Song">
            <source src="https://www.televisiontunes.com/uploads/audio/Stoked.mp3" type="audio/mpeg">
        </audio>
        </section>
        <section>
        <h2>Surfing Video</h2>
        <video controls width="600">
            <track kind="subtitles" srclang="en" label="English" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.vtt">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        </video>
        </section>
        <section>
        <h2>Transcript</h2>
        <p>Enjoy this short surfing-themed video while the music plays.</p>
        </section>
    </body>
</html>
