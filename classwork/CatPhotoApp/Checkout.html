<!DOCTYPE html>
<html lang="en">
    <head>
        <meta  charset="UTF-8">
        <title>Checkout Page</title>
    </head>
    <body>
        <h1>Checkout</h1>
        <section>
        <h2>Your Cart</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsthQsnPU6yjwM4PLL1U9oXmady4g9vk_Z9IB2A5rZEg&s=10" alt="Macbook Pro laptop">
        <p>Macbook Pro laptop <br>$1299.99</p>
        </section>
        <section>
        <h2>Payment Information</h2>
        <form>
            <div>
            <label for="card-name" required> <span aria-hidden="true">*</span>Card Name</label>
            <input type="text" id="card-name" name="card-name" required placeholder="John Doe">
            </div>
            <div>
            <label for="card-number" required> <span aria-hidden="true">*</span>Card Number</label>
            <input type="text" id="card-number" name="card-number" required min="16" max="16" placeholder="1234567812345678" aria-describedby="card-number-help">
            <p id="card-number-help">Help</p>
            </div>
            <p><i>Please enter your 16-digit card number without spaces or dashes</i></p>
            <div>
            <label for="expiry-date" required> <span aria-hidden="true">*</span>Expiry Date</label>
            <input type="datetime" id="expiry-date" name="expiry-date" required placeholder="MM/YY">
            </div>
            <div>
            <label for="cvv" id="cvv" required> <span aria-hidden="true">*</span>CVV</label>
            <input type="text" id="cvv" name="cvv" required min="3" max="3" placeholder="123">
            </div>
            <button type="button">Place Order</button>
        </form>
        </section>
    </body>
</html>
